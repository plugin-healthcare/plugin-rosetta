[project]
site_name = "plugin-rosetta"
site_description = "Toolbox for authoring, validating, and publishing open mapping artifacts."
site_author = "Plugin Healthcare team"
copyright = "Copyright &copy; 2026 Plugin Healthcare"
repo_url = "https://github.com/plugin-healthcare/plugin-rosetta"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]

nav = [
    { "Home" = "index.md" },
    { "Guides" = [
        { "Guides" = "guides/index.md" },
        { "Quickstart" = "guides/quickstart.md" },
        { "Onboarding a Standard and Mapping" = "guides/onboarding.md" },
    ]},
    { "Background" = [
        { "Background" = "background/index.md" },
        { "From Your Standard to Rosetta" = "background/from-standard-to-rosetta.md" },
        { "Registry" = "background/registry.md" },
    ]},
    { "Reference" = [
        { "Reference" = "reference/index.md" },
        { "Command Line" = "reference/cli.md" },
        { "Configuration" = "reference/configuration.md" },
        { "Mapping" = "reference/mapping.md" },
        { "Ontology" = "reference/ontology.md" },
        { "Vocabulary" = "reference/vocabulary.md" },
        { "Artifacts" = "reference/artifacts.md" },
        { "Errors and Reports" = "reference/errors.md" },
    ]},
    { "Decisions" = [
        { "Decisions" = "decisions/README.md" },
        { "ADR-0001: Starter Registry" = "decisions/0001-initialize-workspaces-from-packaged-starter-registry.md" },
        { "ADR-0002: Feature APIs" = "decisions/0002-organize-the-library-around-public-feature-apis.md" },
        { "ADR-0003: Configuration Outside the Library" = "decisions/0003-keep-domain-configuration-outside-the-installed-library.md" },
    ]},
    { "Development" = [
        { "Development" = "development/index.md" },
        { "Capability Matrix" = "development/capability-matrix.md" },
        { "Release Notes" = "development/release-notes.md" },
    ]},
]

[project.theme]
logo = "assets/logo_plugin_rgb_favicon.svg"
favicon = "assets/logo_plugin_rgb_favicon.svg"
language = "en"

features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "header.autohide",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.mkdocstrings]
enabled = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_symbol_type_heading = true
show_signature_annotations = true
separate_signature = true
members_order = "source"
filters = ["!^_", "!^validate_"]
