name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run tara check

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - uses: extractions/setup-just@v3
      - run: uv sync --group dev
      - run: just quickstart
      - run: uv run python notebooks/quickstart_nb.py
      - run: test -s registry/data/mappings/omop-onz-g/omop-onz-g.sssom.tsv -a -s registry/data/mappings/omop-onz-g/omop-onz-g.html

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --group docs
      - run: uv run zensical build --strict
