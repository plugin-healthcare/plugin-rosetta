# Registry of ontology sources used by plugin-rosetta.
#
# Each entry pins a specific ontology version to a stable download URL so that
# `rosetta ontology fetch` can reproducibly retrieve the same bytes every
# time. Nothing here is scraped from HTML at mapping time: the download URLs
# below were manually extracted from each ontology's publication page and
# verified reachable.
#
# `checksum` is left unset until a curator confirms the downloaded bytes and
# backfills the pinned SHA-256 as a reviewed change.
ontology_sources:
  onz-g:
    version: "2.8.1"
    iri: http://purl.org/ozo/onz-g
    # Published at https://kik-v-publicatieplatform.nl/ontologie/onz-g/2.8.1
    # This widoco-generated URL is regenerated on each ontology republish;
    # re-check the publication page if this link stops resolving.
    download_url: https://widoco.kik-v-credentialsplatform.nl/3f22caac-112b-400c-85c4-c4aefa745760/c623775baf6d15e267179affc997230585bcb0f8f8438d87c280a37b2c4899d6/ontology.ttl
  omop-cdm:
    version: "5.4"
    iri: https://w3id.org/omop/ontology
    # raw.githubusercontent.com pinned to a commit SHA (rather than the
    # GitHub Pages mirror at plugin-healthcare.github.io/omop-cdm-owl/ontology.ttl)
    # so the download is immutable and reproducible even if `main` moves.
    download_url: https://raw.githubusercontent.com/plugin-healthcare/omop-cdm-owl/99d42596d675f0905724883fd35a81775f98bfe5/omop_cdm_v5.ttl
